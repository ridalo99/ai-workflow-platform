services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow-dev
      POSTGRES_DB: workflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 3s
      timeout: 2s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://workflow:workflow-dev@db/workflow
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
  web:
    image: node:22
    working_dir: /app
    volumes: ["./frontend:/app", "node_modules:/app/node_modules"]
    environment:
      API_TARGET: http://api:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on: [api]
    ports: ["127.0.0.1:5173:5173"]
volumes:
  pgdata:
  node_modules:
