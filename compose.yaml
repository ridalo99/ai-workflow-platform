services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow-dev
      POSTGRES_DB: workflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 3s
      timeout: 2s
      retries: 15
  approval:
    build: ./approval-service
    environment:
      APPROVAL_THRESHOLD_CENTS: ${APPROVAL_THRESHOLD_CENTS:-500000}
  api:
    build: .
    environment:
      APPROVAL_SERVICE_URL: http://approval:8080
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      DATABASE_URL: postgresql+psycopg://workflow:workflow-dev@db/workflow
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
  worker:
    build: .
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      DATABASE_URL: postgresql+psycopg://workflow:workflow-dev@db/workflow
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "worker.py"]
  web:
    image: node:22
    working_dir: /app
    volumes: ["./frontend:/app", "node_modules:/app/node_modules"]
    environment:
      API_TARGET: http://api:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on: [api]
    ports: ["127.0.0.1:5173:5173"]
volumes:
  pgdata:
  node_modules:
